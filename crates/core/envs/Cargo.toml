[package]
name = "envs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
model.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

# Passwords of SSH hosts: the Keychain (the security-framework rustls already pulls in) and
# the Secret Service over D-Bus (the zbus GPUI already pulls in).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "5"

[dev-dependencies]
test-support.workspace = true
