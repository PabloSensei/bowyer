[package]
name = "terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alacritty_terminal = "=0.26.0"
arc-swap = "1"
crossbeam-channel.workspace = true
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
# A console program of the tests, not shipped: it shows what really reaches a program in
# the pseudoconsole, which no program of the system can.
name = "term-probe"
path = "src/bin/term_probe.rs"
test = false

[[bin]]
# A window program of the tests, not shipped: the close of a terminal must not reach it.
name = "gui-sleeper"
path = "src/bin/gui_sleeper.rs"
test = false

[dev-dependencies]
test-support.workspace = true
