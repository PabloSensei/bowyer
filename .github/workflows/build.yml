name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            binary: bowyer.exe
          - name: Linux
            os: ubuntu-latest
            binary: bowyer
          - name: macOS
            os: macos-latest
            binary: bowyer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GPUI draws through Wayland or X11 with fontconfig and xkbcommon.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev libx11-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

      # The toolchain comes from rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain && cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Tests
        run: cargo test --workspace --exclude ui-kit --no-fail-fast

      - name: Release build
        run: cargo build --release -p harness

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bowyer-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
